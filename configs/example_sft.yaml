app:
  vendor: Omnionix
  app_name: OmniForge
  version: 0.2.5

cli:
  enabled: true
  startup_banner: true
  color: true

project:
  name: omniforge-local-demo
  output_dir: outputs/omniforge-local-demo
  seed: 42

model:
  model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  revision:
  trust_remote_code: false
  torch_dtype: auto
  load_in_4bit: false
  attn_implementation: sdpa
  use_fast_tokenizer: true

adapter:
  mode: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

data:
  source: local
  train_path: data/train.jsonl
  eval_path: data/eval.jsonl
  dataset_name:
  dataset_config_name:
  train_split: train
  eval_split: validation
  text_field: text
  prompt_field: prompt
  response_field: response
  messages_field: messages
  max_length: 1024
  packing: true
  packing_block_size: 1024
  num_proc: 1
  train_on_prompt: false
  append_eos_token: true
  cache_dir: cache
  validation_split_pct: 5

optimization:
  profile: turbo
  auto_profile: true
  low_vram_mode: true
  notebook_safe: true
  torch_compile: false
  dataloader_pin_memory: false
  gradient_checkpointing_reentrant: false
  auto_enable_tf32: true

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  num_train_epochs: 1
  max_steps: -1
  lr_scheduler_type: cosine
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  bf16: false
  fp16: false
  gradient_checkpointing: true
  max_grad_norm: 1.0
  optimizer: adamw_torch
  report_to: []
  save_total_limit: 2
  dataloader_num_workers: 0
  resume_from_checkpoint:
  curriculum:
    enabled: false
    warmup_fraction: 0.4
    min_difficulty: 0.0
    max_difficulty: 1.0
  weighted_loss:
    enabled: true
    default_weight: 1.0

generation:
  max_new_tokens: 128
  temperature: 0.2
  top_p: 0.9

export:
  merge_adapter: true
  output_dir: outputs/omniforge-local-demo/export

hub:
  enabled: false
  repo_id:
  private: true
  path_in_repo: .
  source: export
  commit_message: Upload OmniForge artifacts
  token_env_var: HF_TOKEN

gguf:
  enabled: false
  output_dir: outputs/omniforge-local-demo/gguf
  converter_path:
  quantize: false
  quantization: Q4_K_M
  filename:
  source: export
