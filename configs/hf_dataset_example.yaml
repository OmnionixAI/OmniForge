app:
  vendor: Omnionix
  app_name: OmniForge
  version: 0.2.4

cli:
  enabled: true
  startup_banner: true
  color: true

project:
  name: omniforge-hf-demo
  output_dir: outputs/omniforge-hf-demo
  seed: 42

model:
  model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  torch_dtype: auto
  load_in_4bit: false
  attn_implementation: sdpa
  use_fast_tokenizer: true

adapter:
  mode: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

data:
  source: hf
  train_path:
  eval_path:
  dataset_name: tatsu-lab/alpaca
  dataset_config_name:
  train_split: train
  eval_split:
  text_field: text
  prompt_field: instruction
  response_field: output
  messages_field: messages
  max_length: 1024
  packing: true
  packing_block_size: 1024
  num_proc: 1
  train_on_prompt: false
  append_eos_token: true
  cache_dir: cache
  validation_split_pct: 5

optimization:
  profile: turbo
  auto_profile: true
  low_vram_mode: true
  notebook_safe: true
  torch_compile: false
  dataloader_pin_memory: false
  gradient_checkpointing_reentrant: false
  auto_enable_tf32: true

training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  num_train_epochs: 1
  max_steps: -1
  lr_scheduler_type: cosine
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  bf16: false
  fp16: false
  gradient_checkpointing: true
  max_grad_norm: 1.0
  optimizer: adamw_torch
  report_to: []
  save_total_limit: 2
  dataloader_num_workers: 0
  resume_from_checkpoint:
  curriculum:
    enabled: false
  weighted_loss:
    enabled: true
    default_weight: 1.0

generation:
  max_new_tokens: 128
  temperature: 0.2
  top_p: 0.9

export:
  merge_adapter: false
  output_dir: outputs/omniforge-hf-demo/export
