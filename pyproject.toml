[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniforge"
version = "0.1.7"
description = "OmniForge by Omnionix: a proprietary-oriented CLI for fine-tuning Hugging Face models on local or hub datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.1.0",
  "datasets>=3.0.0",
  "evaluate>=0.4.3",
  "numpy>=1.26.0",
  "packaging>=24.1",
  "peft>=0.13.0",
  "pyyaml>=6.0.2",
  "safetensors>=0.4.5",
  "sentencepiece>=0.2.0",
  "torch>=2.4.0",
  "transformers>=4.46.0",
]

[project.scripts]
omniforge = "omniforge.cli:main"

[tool.setuptools]
packages = ["omniforge", "proptrain"]

